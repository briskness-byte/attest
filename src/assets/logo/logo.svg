<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- A dark letter on amber, not a white one: white on #f59e0b is about 2:1 and fails every
       contrast bar there is, while this pairing is around 9:1 and still reads at 16 pixels. -->
  <defs>
    <linearGradient id="attest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#attest)"/>
  <path d="M26 77 L50 23 L74 77 M36 58 L64 58" fill="none" stroke="#1a1206"
        stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
